<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moze · 竖屏开机预览</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
body{display:grid;place-items:center}
.stage{position:relative;width:min(100vw,75vh);aspect-ratio:3/4;background:#000;overflow:hidden;container-type:inline-size}
.mascot{position:absolute;left:36.328125%;top:20.996094%;width:27.34375%;height:20.507813%;object-fit:contain}
.brand{position:absolute;left:30.46875%;top:85.9375%;width:39.0625%;height:7.03125%}
.footer{position:absolute;left:42.1875%;top:94.726563%;width:15.625%;height:2.929688%}
.ring{position:absolute;left:47.916667%;top:67.773438%;width:4.166667%;height:3.125%;overflow:visible}
.ring path{fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round}
.logs{position:absolute;inset:0;overflow:hidden;pointer-events:none}
pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:400 1.0416667cqw/1 "Cascadia Mono","Consolas",monospace;color:#fff}
.controls{position:fixed;bottom:8px;right:12px;display:flex;gap:10px;align-items:center;font:11px "Segoe UI",sans-serif;color:#777}
.clean .controls{display:none}
button{border:1px solid #333;background:#000;color:#ccc;padding:5px 10px;font:inherit;border-radius:3px}
button:focus-visible{outline:1px solid #fff;outline-offset:3px}
</style>
<main class="stage" aria-label="竖屏开机动画预览">
 <img class="mascot" src="moze-avatar-cutout.png" alt="去除深色背景的原头像">
 <img class="brand" src="powered-by-debian.png" alt="powered by debian，Debian 旋涡图标">
 <img class="footer" src="moze-footer.png" alt="Moze">
 <svg class="ring" viewBox="0 0 64 64" role="progressbar" aria-label="正在启动"><path id="arc" d="M32 6 A26 26 0 0 1 58 32"></path></svg>
 <div class="logs" role="log" aria-label="实机原始内核日志回放"><pre id="logs"></pre></div>
</main>
<div class="controls"><span>预览：实机原始日志回放</span><button id="replay">重播</button><button id="motion" aria-pressed="false">减少动态</button></div>
<script>
// Artwork is a generated raster asset. Code only plays/composites it.
// The boot implementation uses the native vidconsole/earlycon/fbcon paths;
// this labelled browser preview replays a captured, unchanged dmesg excerpt.
const pre=document.querySelector('#logs'),arc=document.querySelector('#arc'),lines=[];
document.body.classList.toggle('clean',new URLSearchParams(location.search).has('clean'));
const preference=matchMedia('(prefers-reduced-motion: reduce)');
let started=performance.now(),shown=-1,lastFrame=-1,spec=null,reduced=preference.matches;
fetch('preview-boot.log').then(r=>{if(!r.ok)throw Error('log unavailable');return r.text()}).then(t=>lines.push(...t.trimEnd().split(/\r?\n/))).catch(()=>document.querySelector('.controls span').textContent='预览：未载入日志');
fetch('spinner-frames.json').then(r=>r.json()).then(t=>spec=t);
function frame(now){const age=now-started;
 if(spec){const index=reduced?spec.reduced_frame:Math.floor(age/spec.frame_ms)%spec.frames.length;
  if(index!==lastFrame){lastFrame=index;const f=spec.frames[index],a=f.start*Math.PI/180,b=(f.start+f.sweep)*Math.PI/180;
   arc.setAttribute('d',`M${32+spec.radius*Math.cos(a)} ${32+spec.radius*Math.sin(a)} A${spec.radius} ${spec.radius} 0 ${f.sweep>180?1:0} 1 ${32+spec.radius*Math.cos(b)} ${32+spec.radius*Math.sin(b)}`);}}
 const index=Math.min(lines.length,Math.floor(age/220));
 if(index!==shown){shown=index;pre.textContent=lines.slice(0,index).join('\n');const area=document.querySelector('.logs');area.scrollTop=area.scrollHeight;}
 requestAnimationFrame(frame);
}requestAnimationFrame(frame);
document.querySelector('#replay').onclick=()=>{started=performance.now();shown=-1;};
function motion(value){reduced=value;document.querySelector('#motion').setAttribute('aria-pressed',reduced);}
document.querySelector('#motion').onclick=()=>motion(!reduced);
preference.onchange=e=>motion(e.matches);motion(reduced);
</script>
</html>
