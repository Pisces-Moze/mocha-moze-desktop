# Adapted from ech678/Nyxuri configs/noctalia/noctalia-config.toml,
# commit ebafe03c9bdf1291eeb83d0f8c368d40a63ccdfd (GPL-3.0).
# Material You capsule layout, with static backgrounds for Tegra124.
[shell]
polkit_agent = true
lang = "zh-Hans"
font_family = "sans-serif"
setup_wizard_enabled = false
telemetry_enabled = false

[shell.animation]
enabled = true
speed = 1.3

[shell.panel]
transparency_mode = "solid"
shadow = false
control_center_placement = "floating"
control_center_position = "top_right"
session_placement = "floating"
session_position = "center"
wallpaper_placement = "floating"
wallpaper_position = "center"

[shell.launcher]
app_grid = true
compact = false
fetch_exchange_rates = false
pinned = ["mocha-keyboard", "foot", "firefox-esr"]

[backdrop]
enabled = false
blur_intensity = 0.0
tint_intensity = 0.0

[bar]
order = ["bar"]

[bar.bar]
position = "top"
background_opacity = 0.0
border_width = 0.0
capsule = true
capsule_border = "outline"
capsule_foreground = "secondary"
capsule_opacity = 1.0
capsule_padding = 10.0
capsule_radius = 80
enabled = true
margin_ends = 14
margin_edge = 10
scale = 1.1
shadow = false
compositor_blur = false
thickness = 40
start = ["launcher", "workspaces", "overview_button", "keyboard_button", "input_method_button"]
center = ["clock"]
end = ["network", "volume", "brightness", "battery", "notifications", "session"]

[dock]
enabled = true
auto_hide = false
margin_edge = 10
radius = 20
reserve_space = false
show_dots = true
smart_auto_hide = true

[widget.keyboard_button]
type = "custom_button"
glyph = "keyboard"
tooltip = "触屏键盘"
actions.left = "exec /usr/local/bin/mocha-keyboard"

[widget.overview_button]
type = "custom_button"
glyph = "layout-grid"
tooltip = "窗口与工作区概览"
actions.left = "exec /usr/local/bin/niri msg action toggle-overview"

[widget.input_method_button]
type = "custom_button"
glyph = "language"
label = "中/英"
tooltip = "切换中文拼音与英文输入"
actions.left = "exec /usr/local/bin/mocha-input-method"

[widget.clock]
format = "{:%m/%d %H:%M}"

[theme]
builtin = "Ayu"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[osd]
background_opacity = 1.0
offset_y = 20
position = "bottom_center"
scale = 1.0

[brightness]
enable_ddcutil = false
minimum_brightness = 0.03

[brightness.monitor.DSI-1]
backend = "backlight"
backlight_device = "mocha-miui-backlight"

[brightness.monitor.Unknown-1]
backend = "backlight"
backlight_device = "mocha-miui-backlight"

[lockscreen]
enabled = true
blurred_desktop = false
transition = []
blur_intensity = 0.0
tint_intensity = 0.2

[system.monitor]
enabled = false

[idle.behavior.lock]
enabled = false
timeout = 300
action = "lock"

[idle.behavior.screen-off]
enabled = false
timeout = 360
action = "screen_off"
